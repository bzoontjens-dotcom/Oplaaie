<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedankt, Veurpruuve</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Manrope:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--diep:#0E1D4A;--oranje:#F07D1A;--ivoor:#FAF6EE}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--diep);color:var(--ivoor);font-family:Manrope,system-ui,sans-serif;text-align:center;padding:24px}
.box{max-width:560px}
img{width:min(260px,64vw);height:auto;margin:0 auto 28px;display:block;max-width:100%}
h1{font-family:"Alfa Slab One",Rockwell,Georgia,serif;font-weight:400;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0 0 14px;text-wrap:balance}
p{font-size:17px;line-height:1.55;color:rgba(250,246,238,.8)}
a{display:inline-block;margin-top:22px;color:var(--diep);background:var(--oranje);padding:14px 26px;border-radius:999px;font-weight:800;text-decoration:none}
.driekleur{position:fixed;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--oranje) 0 33.333%,#3B66CF 33.333% 66.666%,var(--oranje) 66.666%)}
</style>
</head>
<body>
<div class="driekleur" aria-hidden="true"></div>
<div class="box">
  <img src="img/veurpruuve-medaille.svg" width="600" height="600" alt="Veurpruuve. Doar zedde U tege.">
  <h1>Dank je, we hebben je aanvraag ontvangen</h1>
  <p>We nemen binnen twee werkdagen contact met je op. Tot donderdag 4 februari 2027.</p>
  <a href="index.html">Terug naar de site</a>
</div>
</body>
</html>
