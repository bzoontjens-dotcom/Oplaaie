# Instellingen voor Netlify.
# De map "site" is wat bezoekers te zien krijgen. De serverfuncties staan in
# "netlify/functions", de spelregels van de veiling in "veiling/spelregels.mjs".

[build]
  publish = "site"
  # Er hoeft niets gebouwd te worden: de site bestaat uit kant-en-klare bestanden.
  command = "echo De site heeft geen bouwstap nodig"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Lettertypen veranderen nooit, dus de browser mag ze een jaar bewaren.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Agendabestanden openen direct in de agenda van de bezoeker.
[[headers]]
  for = "/agenda/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"

# De beheerpagina hoort niet in zoekmachines en wordt nergens bewaard.
[[headers]]
  for = "/beheer/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# oplaaie.nl verwijst door naar veurpruuve.nl. Deze regels doen pas iets zodra
# het domein oplaaie.nl aan deze site gekoppeld is. Zie README.md, "Live zetten".
[[redirects]]
  from = "https://oplaaie.nl/*"
  to = "https://veurpruuve.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.oplaaie.nl/*"
  to = "https://veurpruuve.nl/:splat"
  status = 301
  force = true

# De oude adressen van de Veurpruuve-site blijven werken.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
